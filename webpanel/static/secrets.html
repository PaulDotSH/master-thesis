<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secrets - Crates Security Scanner</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2>Crates Scanner</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/" data-page="dashboard">Dashboard</a></li>
            <li><a href="/crates.html" data-page="crates">Crates</a></li>
            <li><a href="/dependencies.html" data-page="dependencies">Dependencies</a></li>
            <li><a href="/scan-results.html" data-page="scan-results">Scan Results</a></li>
            <li><a href="/metrics.html" data-page="metrics">Metrics</a></li>
            <li><a href="/vulnerabilities.html" data-page="vulnerabilities">Vulnerabilities</a></li>
            <li><a href="/secrets.html" class="active" data-page="secrets">Secrets</a></li>
            <li><a href="/typosquat.html" data-page="typosquat">Typosquatting</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Secrets</h1>
            <p class="subtitle">Exposed secrets detected by Gitleaks</p>
        </header>

        <section id="secrets-table" class="table-container"></section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        let secretsTable;

        document.addEventListener('DOMContentLoaded', () => {
            secretsTable = new DataTable({
                containerId: 'secrets-table',
                fetchData: (params) => Api.getGitleaks(params),
                columns: [
                    { 
                        key: 'crate_name', 
                        label: 'Crate',
                        render: (val) => val ? `<a href="https://crates.io/crates/${encodeURIComponent(val)}" target="_blank">${escapeHtml(val)}</a>` : '-'
                    },
                    { 
                        key: 'rule_id', 
                        label: 'Rule',
                        render: (val) => `<span class="badge badge-warning">${escapeHtml(val)}</span>`
                    },
                    { 
                        key: 'secret', 
                        label: 'Secret',
                        render: (val) => `<code class="truncate" title="${escapeHtml(val)}">${escapeHtml(truncate(val, 30))}</code>`
                    },
                    { 
                        key: 'loc', 
                        label: 'Location',
                        render: (val) => `<span class="truncate" title="${escapeHtml(val)}">${escapeHtml(truncate(val, 40))}</span>`
                    },
                    { 
                        key: 'entropy', 
                        label: 'Entropy',
                        render: (val) => val.toFixed(2)
                    }
                ],
                filters: [
                    { key: 'crate_name', label: 'Crate Name', type: 'text', placeholder: 'Search crate...' },
                    { key: 'rule_id', label: 'Rule ID', type: 'text', placeholder: 'e.g., api-key' },
                    { key: 'min_entropy', label: 'Min Entropy', type: 'number', placeholder: '0' }
                ],
                defaultSort: 'entropy',
                defaultSortDesc: true
            });
            window['secrets-tableTable'] = secretsTable;
        });
    </script>
</body>
</html>
