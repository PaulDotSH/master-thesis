<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crates - Crates Security Scanner</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2>Crates Scanner</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/" data-page="dashboard">Dashboard</a></li>
            <li><a href="/crates.html" class="active" data-page="crates">Crates</a></li>
            <li><a href="/dependencies.html" data-page="dependencies">Dependencies</a></li>
            <li><a href="/scan-results.html" data-page="scan-results">Scan Results</a></li>
            <li><a href="/vulnerabilities.html" data-page="vulnerabilities">Vulnerabilities</a></li>
            <li><a href="/secrets.html" data-page="secrets">Secrets</a></li>
            <li><a href="/typosquat.html" data-page="typosquat">Typosquatting</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Crates</h1>
            <p class="subtitle">Browse all registered crates</p>
        </header>

        <section id="crates-table" class="table-container"></section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        let cratesTable;
        document.addEventListener('DOMContentLoaded', () => {
            cratesTable = new DataTable({
                containerId: 'crates-table',
                fetchData: (params) => Api.getCrates(params),
                columns: [
                    { key: 'id', label: 'ID' },
                    { 
                        key: 'name', 
                        label: 'Name',
                        render: (val, row) => `<a href="https://crates.io/crates/${encodeURIComponent(val)}" target="_blank">${escapeHtml(val)}</a>`
                    },
                    { 
                        key: 'repository', 
                        label: 'Repository',
                        render: (val) => val ? `<a href="${escapeHtml(val)}" target="_blank" class="truncate" title="${escapeHtml(val)}">${truncate(val, 40)}</a>` : '-'
                    },
                    { 
                        key: 'crate_downloads', 
                        label: 'Downloads',
                        render: (val) => formatNumber(val)
                    },
                    { 
                        key: 'crate_created_at', 
                        label: 'Created',
                        render: (val) => formatDate(val)
                    },
                    { 
                        key: 'crate_updated_at', 
                        label: 'Updated',
                        render: (val) => formatDate(val)
                    }
                ],
                filters: [
                    { key: 'search', label: 'Search', type: 'text', placeholder: 'Crate name...' },
                    { key: 'min_downloads', label: 'Min Downloads', type: 'number', placeholder: '0' },
                    { key: 'max_downloads', label: 'Max Downloads', type: 'number', placeholder: '999999999' }
                ],
                defaultSort: 'downloads',
                defaultSortDesc: true
            });
            window['crates-tableTable'] = cratesTable;
        });
    </script>
</body>
</html>
