<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerabilities - Crates Security Scanner</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2>Crates Scanner</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/" data-page="dashboard">Dashboard</a></li>
            <li><a href="/crates.html" data-page="crates">Crates</a></li>
            <li><a href="/dependencies.html" data-page="dependencies">Dependencies</a></li>
            <li><a href="/scan-results.html" data-page="scan-results">Scan Results</a></li>
            <li><a href="/vulnerabilities.html" class="active" data-page="vulnerabilities">Vulnerabilities</a></li>
            <li><a href="/secrets.html" data-page="secrets">Secrets</a></li>
            <li><a href="/typosquat.html" data-page="typosquat">Typosquatting</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Vulnerabilities</h1>
            <p class="subtitle">Security vulnerabilities from cargo-audit (RustSec)</p>
        </header>

        <section id="vulnerabilities-table" class="table-container"></section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        let vulnerabilitiesTable;
        
        function renderSeverity(val) {
            const { label, class: cls } = getSeverityLabel(val);
            return `<span class="badge badge-${cls}">${label} (${val ?? '?'})</span>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            vulnerabilitiesTable = new DataTable({
                containerId: 'vulnerabilities-table',
                fetchData: (params) => Api.getCargoAudit(params),
                columns: [
                    { 
                        key: 'rustsec_id', 
                        label: 'RustSec ID',
                        render: (val) => `<a href="https://rustsec.org/advisories/RUSTSEC-${encodeURIComponent(val)}" target="_blank">${escapeHtml(val)}</a>`
                    },
                    { 
                        key: 'crate_name', 
                        label: 'Crate',
                        render: (val, row) => val ? `<a href="https://crates.io/crates/${encodeURIComponent(val)}" target="_blank">${escapeHtml(val)}</a>` : '-'
                    },
                    { key: 'crate_id', label: 'Crate ID' },
                    { 
                        key: 'severity', 
                        label: 'Severity',
                        render: renderSeverity
                    }
                ],
                filters: [
                    { key: 'crate_name', label: 'Crate Name', type: 'text', placeholder: 'Search crate...' },
                    { key: 'rustsec_id', label: 'RustSec ID', type: 'text', placeholder: 'RUSTSEC-...' },
                    { key: 'min_severity', label: 'Min Severity', type: 'number', placeholder: '0' }
                ],
                defaultSort: 'severity',
                defaultSortDesc: true
            });
            window['vulnerabilities-tableTable'] = vulnerabilitiesTable;
        });
    </script>
</body>
</html>
