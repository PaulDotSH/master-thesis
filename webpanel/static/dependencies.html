<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dependencies - Crates Security Scanner</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2>Crates Scanner</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/" data-page="dashboard">Dashboard</a></li>
            <li><a href="/crates.html" data-page="crates">Crates</a></li>
            <li><a href="/dependencies.html" class="active" data-page="dependencies">Dependencies</a></li>
            <li><a href="/scan-results.html" data-page="scan-results">Scan Results</a></li>
            <li><a href="/metrics.html" data-page="metrics">Metrics</a></li>
            <li><a href="/vulnerabilities.html" data-page="vulnerabilities">Vulnerabilities</a></li>
            <li><a href="/secrets.html" data-page="secrets">Secrets</a></li>
            <li><a href="/typosquat.html" data-page="typosquat">Typosquatting</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Dependencies</h1>
            <p class="subtitle">Crate dependency relationships</p>
        </header>

        <section id="dependencies-table" class="table-container"></section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        let dependenciesTable;
        document.addEventListener('DOMContentLoaded', () => {
            dependenciesTable = new DataTable({
                containerId: 'dependencies-table',
                fetchData: (params) => Api.getDependencies(params),
                columns: [
                    { key: 'crate_id', label: 'Crate ID' },
                    { 
                        key: 'crate_name', 
                        label: 'Crate',
                        render: (val) => `<a href="https://crates.io/crates/${encodeURIComponent(val)}" target="_blank">${escapeHtml(val)}</a>`
                    },
                    { key: 'dependency_id', label: 'Dependency ID' },
                    { 
                        key: 'dependency_name', 
                        label: 'Depends On',
                        render: (val) => `<a href="https://crates.io/crates/${encodeURIComponent(val)}" target="_blank">${escapeHtml(val)}</a>`
                    }
                ],
                filters: [
                    { key: 'crate_name', label: 'Crate Name', type: 'text', placeholder: 'Search crate...' },
                    { key: 'crate_id', label: 'Crate ID', type: 'number', placeholder: 'ID' },
                    { key: 'dependency_id', label: 'Dependency ID', type: 'number', placeholder: 'ID' }
                ],
                defaultSort: 'crate_id',
                defaultSortDesc: false
            });
            window['dependencies-tableTable'] = dependenciesTable;
        });
    </script>
</body>
</html>
