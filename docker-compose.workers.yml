# Docker Compose for workers only - connects to host's PostgreSQL and Redis
# Usage: sudo docker-compose -f docker-compose.workers.yml up -d --build --scale worker=10

services:
  # Service that seeds the named cargo-registry volume from the image.
  # Runs once per `docker-compose up`; workers wait for it since depends_on.
  registry-seeder:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /usr/local/cargo/registry/.seeded ]; then
          cp -r /cargo-seed/registry/. /usr/local/cargo/registry/ && \
          touch /usr/local/cargo/registry/.seeded
        fi
    volumes:
      - cargo-registry:/usr/local/cargo/registry
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    network_mode: "host"
    depends_on:
      registry-seeder:
        condition: service_completed_successfully
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/crates
      - REDIS_URL=redis://127.0.0.1:6379
    volumes:
      - ./crates_downloader/config.toml:/app/config.toml
      - /tmp/crates:/tmp/crates  # RAM disk mount - run: sudo mount -t tmpfs -o size=4G tmpfs /tmp/crates
      - ./logs/docker:/app/logs  # logs to host
      - cargo-registry:/usr/local/cargo/registry  # Shared registry
    tmpfs:
      - /usr/local/cargo/target:size=1g  # Only build artifacts in tmpfs, not the whole cargo home
      - /usr/local/cargo/git:size=256m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  cargo-registry:
