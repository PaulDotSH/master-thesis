<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Metrics - Crates Security Scanner</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h2>Crates Scanner</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/" data-page="dashboard">Dashboard</a></li>
            <li><a href="/crates.html" data-page="crates">Crates</a></li>
            <li><a href="/dependencies.html" data-page="dependencies">Dependencies</a></li>
            <li><a href="/scan-results.html" data-page="scan-results">Scan Results</a></li>
            <li><a href="/metrics.html" class="active" data-page="metrics">Metrics</a></li>
            <li><a href="/vulnerabilities.html" data-page="vulnerabilities">Vulnerabilities</a></li>
            <li><a href="/secrets.html" data-page="secrets">Secrets</a></li>
            <li><a href="/typosquat.html" data-page="typosquat">Typosquatting</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Analysis Metrics</h1>
            <p class="subtitle">Execution timing per crate analysis run</p>
        </header>

        <section id="metrics-table" class="table-container"></section>
    </main>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const metricsTable = new DataTable({
                containerId: 'metrics-table',
                fetchData: (params) => Api.getMetrics(params),
                columns: [
                    { key: 'crate_id', label: 'Crate ID' },
                    { key: 'crate_name', label: 'Crate', render: (v) => escapeHtml(v) },
                    { key: 'total_duration_ms', label: 'Total (ms)', render: (v) => formatNumber(v) },
                    { key: 'download_duration_ms', label: 'Download', render: (v) => v == null ? '-' : formatNumber(v) },
                    { key: 'cargo_audit_duration_ms', label: 'Cargo Audit', render: (v) => v == null ? '-' : formatNumber(v) },
                    { key: 'gitleaks_duration_ms', label: 'Gitleaks', render: (v) => v == null ? '-' : formatNumber(v) },
                    { key: 'executable_check_duration_ms', label: 'Executables', render: (v) => v == null ? '-' : formatNumber(v) },
                    { key: 'build_rs_analysis_duration_ms', label: 'Build.rs', render: (v) => v == null ? '-' : formatNumber(v) },
                    { key: 'llm_analysis_duration_ms', label: 'LLM', render: (v) => v == null ? '-' : formatNumber(v) },
                    { key: 'worker_id', label: 'Worker', render: (v) => escapeHtml(v || '-') },
                    { key: 'completed_at', label: 'Completed At', render: formatDate },
                ],
                filters: [
                    { key: 'crate_name', label: 'Crate Name', type: 'text', placeholder: 'Search...' },
                    { key: 'crate_id', label: 'Crate ID', type: 'number', placeholder: 'ID' },
                ],
                defaultSort: 'completed_at',
                defaultSortDesc: true,
            });

            window['metrics-tableTable'] = metricsTable;
        });
    </script>
</body>
</html>
